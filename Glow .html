<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Glow Studio</title>
<style>
:root{--bg:#000;--panel:#1f1f1f;--ink:#fff;--mute:#8e8e8e;--accent:#6fcf97;--line:#303030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:6px;padding:8px 10px}
h1{font:600 19px/1 "Avenir Next",Georgia,serif;margin:0 auto 0 4px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
button:active{transform:scale(.96)}
button.main{background:var(--accent);color:#2a1119;border:0;font-weight:600}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px;position:relative}
canvas{max-width:100%;max-height:100%;border-radius:10px;touch-action:none;background:#000}
#empty{position:absolute;text-align:center;color:var(--mute);padding:20px}
#empty button{margin-top:12px;font-size:17px;padding:14px 22px}
#tools{background:var(--panel);border-radius:26px 26px 0 0;padding:4px 12px 12px}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.top{border-bottom:1px solid var(--line);padding:6px 0 0;gap:0}
.top button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;font-weight:600;font-size:14px;color:var(--ink);padding:10px 2px}
.top button.on{color:var(--accent);border-color:var(--accent)}
.top svg{width:20px;height:20px}
#tsub{padding:12px 0 6px;gap:6px}
.sb{flex:0 0 auto;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:13px;font-weight:600;color:var(--ink)}
.sb svg{width:34px;height:34px;stroke-width:1.4}
.sb.on{color:var(--accent)}
.pc{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:13px;color:var(--ink)}
.pc i{width:70px;height:78px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;color:#fff}
.pc i svg{width:34px;height:34px}.pc.on i{border-color:var(--accent)}.pc.on{color:var(--accent)}
textarea,input[type=password],input:not([type]){width:100%;background:#2d2d2d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:6px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;font-size:14px;background:#2d2d2d;border-color:#2d2d2d}
.chip.on{background:var(--accent);color:#2a1119;border-color:var(--accent)}
#pn{height:190px;overflow-y:auto}
.s{display:grid;grid-template-columns:100px 1fr 32px;align-items:center;gap:8px;margin:5px 0}
.s span{color:var(--mute);font-size:14px}.s output{text-align:right;font-size:13px;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{flex:0 0 auto;width:34px;height:34px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{border-color:#fff}
.hint{color:var(--mute);font-size:13px;margin:2px 0 6px}
</style>
</head>
<body>
<header><h1>Glow Studio</h1>
<button id="open">Open</button><button id="undo">Undo</button><button id="cmp">Compare</button><button class="main" id="save">Save</button></header>
<div id="stage"><canvas id="cv" hidden></canvas>
<div id="empty">Choose a photo to start editing.<br><button class="main" id="open2">Open photo</button></div></div>
<div id="tools">
<div class="row top" id="tmain"></div>
<div class="row" id="tsub"></div>
<div id="pn"></div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const MAX=1400;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true});return c};
let src=null,blurC=null,lm=null,faceMsg='Open a photo first.',comparing=false,raf=0,mode=null,undo=[];
let main='Face',sub='Beauty',bs=40,bstr=50,bop=45,bcol='#7b3f1d',brushTool='push';

// slider definitions: key -> [label, min, max]
const S={smooth:['Smooth skin',0,100],shine:['Reduce shine',0,100],bright:['Brightness',-50,50],contrast:['Contrast',-50,50],sat:['Color',-100,100],
warm:['Warmth',-50,50],sharp:['Sharpen',0,100],fade:['Fade',0,60],vig:['Vignette',0,100],eyes:['Eye size',-50,50],slim:['Slim face',0,60],
nose:['Slim nose',0,60],lips:['Lip size',-50,50],chin:['Chin',-50,50],teeth:['Whiten teeth',0,100],lipstick:['Lipstick',0,100],blush:['Blush',0,100],tone:['Color grade',-50,50],grain:['Film grain',0,100],even:['Even tone',0,100],look:['Filter strength',0,100]};
const NEEDS_FACE=['eyes','slim','nose','lips','chin','teeth','lipstick','blush'];
const BEAUTY_KEYS=['smooth','bright','teeth','eyes','slim','nose','lips','chin','lipstick','blush','shine','even'];
const FILTER_KEYS=['contrast','sat','warm','fade','vig','tone','grain','look'];
const beauty={None:{},Retouch:{smooth:40,bright:8,teeth:25,eyes:10,slim:10,shine:20},Kiss:{smooth:45,bright:6,eyes:10,lips:15,lipstick:70,blush:30},
Natural:{smooth:25,bright:5,teeth:15,eyes:5,shine:15},Grace:{smooth:50,bright:8,eyes:12,slim:25,nose:15,chin:8,lipstick:45},
Lovely:{smooth:55,bright:12,teeth:25,eyes:20,lips:12,lipstick:25,blush:45},Glam:{smooth:60,bright:10,teeth:45,eyes:18,slim:20,nose:12,lips:10,lipstick:40,blush:30},
Fresh:{smooth:45,bright:14,teeth:30,eyes:12,blush:20,shine:25}};
const skin={None:{},'Clear Skin':{smooth:30,even:35,shine:20},'Clear Skin 2':{smooth:45,even:50,shine:30},'Smooth Skin':{smooth:60,even:45,shine:20},'Flawless Skin':{smooth:75,even:60,shine:40},Blemishes:{smooth:20,even:30,heal:1}};
const filters={Original:{},Clean:{lut:'Clean',look:100,contrast:6,sat:8},Portra:{lut:'Portra',look:100,sat:6,warm:6,fade:6,grain:10},
Fuji:{lut:'Fuji',look:100,contrast:6,sat:4,grain:12},Cinema:{lut:'Cinema',look:100,contrast:10,vig:30,grain:14},Golden:{lut:'Golden',look:100,warm:12,sat:10,vig:18,fade:4},
Matte:{lut:'Matte',look:100,sat:-6,grain:8},Vivid:{lut:'Vivid',look:100,sat:14},Noir:{lut:'Noir',look:100,sat:-100,contrast:8,vig:30,grain:28},Glow:{contrast:-8,sat:10,warm:8,fade:8,tone:8}};
const TABS={Face:{Beauty:{keys:['smooth','bright','teeth'],chips:[beauty,BEAUTY_KEYS],cards:1},Sizes:{keys:['eyes','slim','nose','lips','chin']},
Features:{keys:['teeth','lipstick','blush']},Skin:{keys:['smooth','even','shine'],chips:[skin,['smooth','even','shine']],cards:1,hint:'Pick a look. Choose Blemishes, then tap spots on the photo to heal them.'},Filters:{chips:[filters,FILTER_KEYS],keys:['look','tone','grain','fade','vig'],cards:'thumb'}},
Edit:{Adjust:{keys:['bright','contrast','sat','warm','sharp','fade','vig']},Crop:{crop:1}},
Body:{Reshape:{body:1}},Hair:{Color:{paint:1}},AI:{Background:{bg:1},Gemini:{ai:1}}};

const v={},rows={};
let cur=null,inten=70,skinM=null,lipM=null,teethM=null,featM=null,curLut=null,thumb=null;
const scaled=(o,i)=>{const r={};for(const k in o)r[k]=typeof o[k]==='number'?Math.round(o[k]*i/100):o[k];return r};
Object.entries(S).forEach(([k,[l,mn,mx]])=>{
  v[k]=0;const r=document.createElement('div');r.className='s';
  r.innerHTML=`<span>${l}</span><input type="range" min="${mn}" max="${mx}" value="0"><output>0</output>`;
  r.querySelector('input').oninput=e=>{v[k]=+e.target.value;r.querySelector('output').textContent=v[k];queue()};
  rows[k]=r;
});
function setKeys(keys,o){keys.forEach(k=>{v[k]=o[k]||0;rows[k].querySelector('input').value=v[k];rows[k].querySelector('output').textContent=v[k]})}
function chip(t,fn,on){const b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=t;b.onclick=()=>fn(b);return b}
function slider(label,mn,mx,val,fn){
  const r=document.createElement('div');r.className='s';
  r.innerHTML=`<span>${label}</span><input type="range" min="${mn}" max="${mx}" value="${val}"><output>${val}</output>`;
  r.querySelector('input').oninput=e=>{r.querySelector('output').textContent=e.target.value;fn(+e.target.value)};return r}

const IC={Face:'<path d="M6.5 10.5C6.5 6.5 9 4 12 4s5.5 2.5 5.5 6.5v2.5c0 4-2.3 7-5.5 7s-5.5-3-5.5-7z"/>',
Edit:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
Body:'<path d="M8 4c-1 4-3 6-3 10M16 4c1 4 3 6 3 10M9 9c1 3 1 7 0 11M15 9c-1 3-1 7 0 11"/>',
Hair:'<path d="M5 13c0-5 3-9 7-9s7 4 7 9v3c0 1-1 2-2 2H7c-1 0-2-1-2-2zM9 12c2 0 4-1 6-4"/>',
Beauty:'<path d="M7 12.5C6 9 8 5 12 5c2 0 3.5 1 4.5 2.5M16 11v2c0 3.5-2 6-4 6s-4-2.5-4-6"/><path d="M5 4l.8 1.7L7.5 6.5l-1.7.8L5 9l-.8-1.7-1.7-.8 1.7-.8z"/>',
Sizes:'<path d="M7 6c1.5-1.3 3.2-2 5-2s3.5.7 5 2M3 13h18M6 10l-3 3 3 3M18 10l3 3-3 3M8 17c1 1.3 2.4 2 4 2s3-.7 4-2"/>',
Features:'<path d="M6.5 10.5C6.5 6.5 9 4 12 4s5.5 2.5 5.5 6.5v2.5c0 4-2.3 7-5.5 7s-5.5-3-5.5-7zM6.5 10c3 0 5-1.5 6-3.5 1 2 3 3.5 5 3.5"/>',
Filters:'<circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/>',
Crop:'<path d="M7 3v14h14M3 7h14v14"/>',
Reshape:'<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>',
Color:'<path d="M12 3c3 4 6 7 6 11a6 6 0 01-12 0c0-4 3-7 6-11z"/>'};
IC.AI='<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/>';
IC.Adjust=IC.Edit;IC.Skin=IC.Beauty;IC.Gemini=IC.AI;IC.Background='<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.500 7 6.5"/>';
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.Face}</svg>`;
function drawTabs(){
  const tm=$('tmain');tm.innerHTML='';
  Object.keys(TABS).forEach(n=>{const b=document.createElement('button');b.innerHTML=ico(n)+'<span>'+n+'</span>';b.className=n===main?'on':'';
    b.onclick=()=>{main=n;sub=Object.keys(TABS[n])[0];drawTabs()};tm.appendChild(b)});
  const ts=$('tsub');ts.innerHTML='';
  const subs=Object.keys(TABS[main]);
  if(subs.length>1)subs.forEach(n=>{const b=document.createElement('button');b.className='sb'+(n===sub?' on':'');b.innerHTML=ico(n)+'<span>'+n+'</span>';b.onclick=()=>{sub=n;drawTabs()};ts.appendChild(b)});
  ts.style.display=subs.length>1?'flex':'none';
  drawPanel();
}
function drawPanel(){
  const c=TABS[main][sub],P=$('pn');P.innerHTML='';mode=c.mode||null;
  if(c.hint){const h=document.createElement('p');h.className='hint';h.textContent=c.hint;P.appendChild(h)}
  if(c.chips){const [set,keys]=c.chips,r=document.createElement('div');r.className='row';cur=null;inten=c.cards==='thumb'?100:c.cards?70:100;
    Object.keys(set).forEach(n=>{
      const go=b=>{r.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');cur={o:set[n],keys};if(keys===FILTER_KEYS)curLut=set[n].lut||null;setKeys(keys,scaled(set[n],inten));mode=set[n].heal?'heal':null;queue()};
      r.appendChild(c.cards==='thumb'&&thumb?card(n,go,thumbCanvas(set[n])):c.cards?card(n,go):chip(n,go))});P.appendChild(r);
    P.appendChild(slider('Intensity',0,100,inten,x=>{inten=x;if(cur){setKeys(cur.keys,scaled(cur.o,x));queue()}}))}
  if(c.keys){
    if(c.keys.some(k=>NEEDS_FACE.includes(k))){const h=document.createElement('p');h.className='hint';h.id='fm';h.textContent=faceMsg;P.appendChild(h)}
    c.keys.forEach(k=>P.appendChild(rows[k]))}
  if(c.body){mode=brushTool;
    const r=document.createElement('div');r.className='row';
    [['push','Push'],['bloat','Enlarge'],['pinch','Shrink']].forEach(([m,l])=>r.appendChild(chip(l,b=>{brushTool=mode=m;r.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on')},m===brushTool)));
    P.appendChild(r);
    const h=document.createElement('p');h.className='hint';h.textContent='Drag on the photo to reshape waist, arms, legs or anything else.';P.appendChild(h);
    P.appendChild(slider('Brush size',5,100,bs,x=>bs=x));P.appendChild(slider('Strength',10,100,bstr,x=>bstr=x))}
  if(c.paint){mode='paint';
    const r=document.createElement('div');r.className='row';
    ['#111111','#4a2511','#7b3f1d','#b5651d','#d9a441','#e8c9a0','#c1272d','#e84a8a','#8e44ad','#2e86de','#1abc9c'].forEach(col=>{
      const b=document.createElement('button');b.className='sw'+(col===bcol?' on':'');b.style.background=col;
      b.onclick=()=>{bcol=col;r.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on')};r.appendChild(b)});
    P.appendChild(r);
    const h=document.createElement('p');h.className='hint';h.textContent='Paint over hair to change its color. Works for lips and eyebrows too.';P.appendChild(h);
    P.appendChild(slider('Brush size',5,100,bs,x=>bs=x));P.appendChild(slider('Intensity',10,100,bop,x=>bop=x))}
  if(c.bg)bgPanel(P);
  if(c.ai)aiPanel(P);
  if(c.crop){const r=document.createElement('div');r.className='row';
    r.appendChild(chip('Rotate',()=>xform('rot')));r.appendChild(chip('Flip',()=>xform('flip')));
    [['Square',1],['4:5',.8],['9:16',9/16],['16:9',16/9]].forEach(([l,a])=>r.appendChild(chip('Crop '+l,()=>xform('crop',a))));P.appendChild(r)}
}

const card=(n,fn,tc)=>{const b=document.createElement('button');b.className='pc';let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;
  b.innerHTML=`<i style="background:linear-gradient(145deg,hsl(${h},65%,72%),hsl(${(h+50)%360},60%,42%))">${ico('Beauty')}</i><span>${n}</span>`;b.onclick=()=>fn(b);
  if(tc){const e=b.querySelector('i');e.innerHTML='';e.style.background='none';tc.style.cssText='width:100%;height:100%;border-radius:12px;object-fit:cover;display:block';e.appendChild(tc)}
  return b};
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}}};
const GM='gemini-3.1-flash-image';
function aiPanel(P){
  const q=['Remove blemishes and even out skin tone','Soft studio lighting','Give a natural smile','Neaten the hair','Blur the background','Clean grey studio background'];
  const r=document.createElement('div');r.className='row';
  const t=document.createElement('textarea');t.rows=2;t.placeholder='Describe the edit, for example: soft natural smile';
  q.forEach(x=>r.appendChild(chip(x,()=>{t.value=x})));
  const go=document.createElement('button');go.className='main';go.textContent='Edit with Gemini';go.style.width='100%';go.style.marginTop='6px';
  const st=document.createElement('p');st.className='hint';st.textContent=ls.get('gkey')?'Ready. Your photo is sent to Google when you tap Edit.':'Add your Gemini API key below to start.';
  const k=document.createElement('input');k.type='password';k.placeholder='Gemini API key (saved on this device only)';k.value=ls.get('gkey');k.onchange=()=>ls.set('gkey',k.value.trim());
  const m=document.createElement('input');m.placeholder='Model name';m.value=ls.get('gmodel')||GM;m.onchange=()=>ls.set('gmodel',m.value.trim());
  go.onclick=()=>aiEdit(t.value.trim(),k.value.trim(),m.value.trim()||GM,st);
  P.append(r,t,go,st,k,m);
}
async function aiEdit(prompt,key,model,st){
  if(!src){st.textContent='Open a photo first.';return}
  if(!key){st.textContent='Add your Gemini API key first.';return}
  if(!prompt){st.textContent='Describe the edit first.';return}
  ls.set('gkey',key);ls.set('gmodel',model);comparing=false;render();
  const sc2=Math.min(1,1280/Math.max(cv.width,cv.height)),t=mk(Math.round(cv.width*sc2),Math.round(cv.height*sc2));
  t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
  const data=t.toDataURL('image/jpeg',0.9).split(',')[1];
  st.textContent='Gemini is editing. This can take up to a minute.';
  try{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{parts:[{text:prompt+'. Keep the same person, face, pose and everything else unchanged.'},{inline_data:{mime_type:'image/jpeg',data}}]}],generationConfig:{responseModalities:['TEXT','IMAGE']}})});
    const j=await res.json();
    if(!res.ok)throw new Error((j.error&&j.error.message)||('Error '+res.status));
    const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    const p=parts.find(x=>x.inlineData||x.inline_data);
    if(!p)throw new Error((parts.find(x=>x.text)||{}).text||'Gemini returned no image. Try different wording.');
    const d=p.inlineData||p.inline_data,img=new Image();
    img.onload=()=>{snap();const f=Math.min(1,MAX/Math.max(img.width,img.height));src=mk(Math.round(img.width*f),Math.round(img.height*f));
      src.getContext('2d').drawImage(img,0,0,src.width,src.height);setKeys(Object.keys(S),{});curLut=null;refresh();st.textContent='Done. Tap Undo to go back.'};
    img.onerror=()=>{st.textContent='Could not read the image Gemini returned.'};
    img.src='data:'+(d.mimeType||d.mime_type||'image/png')+';base64,'+d.data;
  }catch(e){st.textContent='Gemini error: '+e.message}
}

// ---------- on-device AI: background blur / replace (free, no key, runs on the phone) ----------
let segmenter=null;
async function initSeg(){
  if(segmenter)return;
  try{
    const m=await import(MP+'/vision_bundle.mjs'),fs=await m.FilesetResolver.forVisionTasks(MP+'/wasm');
    segmenter=await m.ImageSegmenter.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite'},runningMode:'IMAGE',outputCategoryMask:true,outputConfidenceMasks:false});
  }catch(e){segmenter=null}
}
function bgPanel(P){
  const r=document.createElement('div');r.className='row';
  const st=document.createElement('p');st.className='hint';st.textContent='Runs on your phone. Free, no key needed. Works best with a person facing the camera.';
  [['Blur',null],['Studio grey','#9aa0a8'],['White','#ffffff'],['Black','#111111'],['Pink','#f7b6c8'],['Sky','#8ec5ff'],['Warm','#e9c9a0']].forEach(([l,c])=>r.appendChild(chip(l,()=>bgApply(c,st))));
  P.append(r,st);
}
async function bgApply(color,st){
  if(!src){st.textContent='Open a photo first.';return}
  st.textContent='Finding the person. The first time downloads the AI model.';
  await initSeg();
  if(!segmenter){st.textContent='The AI model could not load. Check your internet connection and try again.';return}
  try{
    const res=segmenter.segment(src),cm=res.categoryMask,mw=cm.width,mh=cm.height,arr=cm.getAsUint8Array();
    let on=0,off=0;
    for(let y=Math.floor(mh*.3);y<mh*.7;y++)for(let x=Math.floor(mw*.35);x<mw*.65;x++){arr[y*mw+x]?on++:off++}
    const personNonZero=on>=off,w=src.width,h=src.height;
    const small=mk(mw,mh),sx=small.getContext('2d'),sim=sx.createImageData(mw,mh);
    for(let i=0;i<mw*mh;i++){const isP=(arr[i]!==0)===personNonZero;sim.data[i*4]=sim.data[i*4+1]=sim.data[i*4+2]=255;sim.data[i*4+3]=isP?255:0}
    sx.putImageData(sim,0,0);
    try{cm.close&&cm.close();res.close&&res.close()}catch(e){}

  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){

    fn(dx,dy,dist/r,o);

  const r=bs/100*src.width*0.1+10,c=sc();
  if(mode==='push'){const dx=b.x-a.x,dy=b.y-a.y;if(!first)warpRegion(c,b.x,b.y,r,(x,y,t,o)=>{const k=(1-t)*(1-t)*bstr/50;o.x=x-dx*k;o.y=y-dy*k})}
  else if(mode==='bloat'||mode==='pinch'){warpRegion(c,b.x,b.y,r,scaleFn((mode==='bloat'?1:-1)*0.07*bstr/50))}
  else if(mode==='heal'){if(first)heal(b.x,b.y,Math.max(12,r*0.5))}
  else if(mode==='paint'){
    const n=Math.max(1,Math.ceil(dist(a,b)/(r*0.3)));
    c.save();c.globalCompositeOperation='color';
    for(let i=0;i<=n;i++){const x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n,g=c.createRadialGradient(x,y,0,x,y,r),al=bop/100*0.35;
      g.addColorStop(0,hexA(bcol,al));g.addColorStop(.6,hexA(bcol,al*0.7));g.addColorStop(1,hexA(bcol,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
    c.restore();
  }
  queue();
}
const hexA=(h,a)=>`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;
function heal(cx,cy,r){
  const W=src.width,H=src.height,x0=Math.max(0,Math.floor(cx-r)),y0=Math.max(0,Math.floor(cy-r)),x1=Math.min(W,Math.ceil(cx+r)),y1=Math.min(H,Math.ceil(cy+r));
  const bw=x1-x0,bh=y1-y0;if(bw<2||bh<2)return;
  const c=sc(),im=c.getImageData(x0,y0,bw,bh),d=im.data;
  // heal from a ring of skin around the spot, not the spot itself
  let R=0,G=0,B=0,n=0;
  for(let a=0;a<16;a++){const x=Math.round(cx+Math.cos(a/16*6.283)*r*1.5),y=Math.round(cy+Math.sin(a/16*6.283)*r*1.5);
    if(x>=0&&y>=0&&x<W&&y<H){const p=c.getImageData(x,y,1,1).data;R+=p[0];G+=p[1];B+=p[2];n++}}
  if(!n)return;R/=n;G/=n;B/=n;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    const t=Math.hypot(x+x0-cx,y+y0-cy)/r;if(t>=1)continue;
    const k=Math.min(1,(1-t)*1.6),i=(y*bw+x)*4;
    d[i]+=(R-d[i])*k;d[i+1]+=(G-d[i+1])*k;d[i+2]+=(B-d[i+2])*k;
  }
  c.putImageData(im,x0,y0);
}

// ---------- compare + save ----------
const cmp=$('cmp'),hold=on=>e=>{e.preventDefault();comparing=on;queue()};
['touchstart','mousedown'].forEach(t=>cmp.addEventListener(t,hold(true),{passive:false}));
['touchend','touchcancel','mouseup','mouseleave'].forEach(t=>cmp.addEventListener(t,hold(false)));
$('save').onclick=()=>{
  if(!src){alert('Open a photo first.');return}
  comparing=false;render();
  cv.toBlob(async blob=>{
    const file=new File([blob],'glow-photo.png',{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}
    catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='glow-photo.png';document.body.appendChild(a);a.click();a.remove();
  },'image/png');
};
drawTabs();
</script>
